name: Update and deploy literature watch

on:
  push:
    branches: ["main"]
  schedule:
    # 20:00 Asia/Shanghai (UTC+8)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: literature-watch-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Search new literature candidates
        run: python scripts/update_literature.py

      - name: Generate experimental-method PDFs
        run: python scripts/generate_method_pdfs.py

      - name: Build public site
        run: python scripts/build_public.py

      - name: Save candidate review queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review_queue.json downloads
          git diff --cached --quiet || git commit -m "chore: update literature review queue"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
