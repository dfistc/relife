name: Update private literature watch data

on:
  push:
    branches: ["main"]
  schedule:
    # 20:00 Asia/Shanghai (UTC+8)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: literature-watch-private-data
  cancel-in-progress: false

jobs:
  update-literature:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search new literature candidates
        run: python scripts/update_literature.py

      - name: Upload candidate review queue
        uses: actions/upload-artifact@v4
        with:
          name: literature-review-queue
          path: data/review_queue.json
          overwrite: true
